<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ninja Brick Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b2f; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; background: #87ceeb; border-radius: 12px; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const W = 960, H = 540, GROUND = 460;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'bold 28px "Arial Rounded MT Bold", Arial, sans-serif';

const NINJAS = [
  { name: 'Kai',   c: '#d62828', d: '#8f1d1d' },
  { name: 'Jay',   c: '#1d6fd6', d: '#154a8f' },
  { name: 'Cole',  c: '#3a3a3a', d: '#151515' },
  { name: 'Zane',  c: '#f4f4f4', d: '#b8b8b8' },
  { name: 'Lloyd', c: '#2e9e3e', d: '#1f6b2a' },
];
const POKE = [
  { id: 'pika', name: 'Pikachu' }, { id: 'char', name: 'Charmander' }, { id: 'squirt', name: 'Squirtle' },
  { id: 'bulb', name: 'Bulbasaur' }, { id: 'eevee', name: 'Eevee' }, { id: 'jigg', name: 'Jigglypuff' },
  { id: 'psy', name: 'Psyduck' }, { id: 'meow', name: 'Meowth' },
  { id: 'mew2', name: 'Mewtwo' },            // rare: always keep last
];
const pickKind = () => Math.random() < 0.07 ? POKE.length - 1 : Math.floor(Math.random() * (POKE.length - 1));
const BRICKS = ['#e63946', '#2a9d8f', '#f4a261', '#4361ee', '#9b5de5', '#f7c531'];

let state = 'menu', sel = 0;
let keys = {}, t = 0, cam = 0, nextX = 0, lastMile = 0;
let p, platforms, items, parts, texts, score;

// quiz settings (saved in the browser)
let cfg = { count: true, add: true, letters: true, level: 0, truck: true, voice: true };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('nbr_cfg') || '{}')); } catch (e) {}
function saveCfg() { try { localStorage.setItem('nbr_cfg', JSON.stringify(cfg)); } catch (e) {} }
const LEVELS = ['Easy', 'Medium', 'Hard'];
const BW = 172;
const SETBTN = [
  { id: 'count', x: 22, label: 'Counting' }, { id: 'add', x: 208, label: 'Adding' },
  { id: 'letters', x: 394, label: 'Reading' }, { id: 'level', x: 580, label: 'Level' },
  { id: 'truck', x: 766, label: 'Ride' },
];
const quizOn = () => cfg.count || cfg.add || cfg.letters;
function toggleSetting(id) {
  if (id === 'level') cfg.level = (cfg.level + 1) % 3; else cfg[id] = !cfg[id];
  saveCfg(); beep(500, 0.06);
}
let quiz = null, lastQuiz = -99;
const misses = { count: 0, add: 0, letters: 0 };

// ---------- sound ----------
let ac;
function beep(f, d = 0.12, type = 'square', v = 0.05) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.stop(ac.currentTime + d);
  } catch (e) {}
}
function jingle(notes) { notes.forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.07), i * 90)); }

// ---------- setup ----------
function reset() {
  p = { x: 120, y: GROUND, vx: 0, vy: 0, face: 1, jumps: 0, on: true, spinning: false };
  platforms = []; items = []; parts = []; texts = [];
  score = { studs: 0, balls: 0, buddies: 0, stars: 0, caught: Object.fromEntries(POKE.map(q => [q.id, 0])) };
  cam = 0; t = 0; nextX = 500; lastMile = 0; lastQuiz = -99; quiz = null;
}

function addStud(x, y) { items.push({ k: 'stud', x, y }); }
function gen(x) {
  let r = Math.floor(Math.random() * 6);
  if (r === 5 && x < 1200) r = 0;           // no skeletons right at the start
  if (r === 5) {                            // Skulkin skeleton: jump on it or spin to smash it
    items.push({ k: 'skel', x0: x + 140, x: x + 140, y: GROUND });
    for (let i = 0; i < 5; i++) addStud(x + 60 + i * 50, GROUND - 130 - Math.sin(i / 4 * Math.PI) * 30);
    nextX += 460;
    return;
  }
  if (r === 0) {            // arc of studs
    for (let i = 0; i < 7; i++) addStud(x + i * 40, GROUND - 30 - Math.sin(i / 6 * Math.PI) * 110);
    nextX += 380;
  } else if (r === 1) {     // floating brick with studs (+ maybe a ball)
    const w = 140 + Math.random() * 80, y = GROUND - (100 + Math.random() * 70);
    platforms.push({ x, y, w, color: BRICKS[Math.random() * BRICKS.length | 0] });
    for (let i = 0; i < 4; i++) addStud(x + 24 + i * (w - 48) / 3, y - 24);
    if (Math.random() < 0.6) items.push({ k: 'ball', x: x + w / 2, y: y - 90 });
    nextX += w + 220;
  } else if (r === 2) {     // staircase
    for (let i = 0; i < 3; i++) {
      const y = GROUND - 70 * (i + 1);
      platforms.push({ x: x + i * 170, y, w: 120, color: BRICKS[(i + 2) % BRICKS.length] });
      addStud(x + i * 170 + 60, y - 24);
    }
    items.push({ k: 'ball', x: x + 2 * 170 + 60, y: GROUND - 210 - 50 });
    nextX += 640;
  } else if (r === 3) {     // friendly yellow buddy
    items.push({ k: 'buddy', kind: pickKind(), x0: x + 100, x: x + 100, y: GROUND - 20 });
    for (let i = 0; i < 5; i++) addStud(x + 40 + i * 50, GROUND - 90);
    nextX += 420;
  } else {                  // high ball (needs double jump) + ground studs
    items.push({ k: 'ball', x: x + 120, y: GROUND - 210 });
    for (let i = 0; i < 5; i++) addStud(x + i * 45, GROUND - 24);
    nextX += 400;
  }
}

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 280;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.9 + Math.random() * 0.5,
      color: colors[Math.random() * colors.length | 0], size: 5 + Math.random() * 6 });
  }
}
function say(txt, x, y) { texts.push({ txt, x, y, life: 1.3 }); }

// ---------- input ----------
function speak(s) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s); u.rate = 0.85; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function startGame() {
  reset(); state = 'play'; beep(520, 0.15, 'triangle'); beep(780, 0.2, 'triangle');
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} // unlock speech on iPad
}
function jump() {
  if (state !== 'play' || p.jumps >= 2) return;
  p.vy = -640; p.jumps++; p.on = false;
  beep(p.jumps === 1 ? 420 : 560, 0.12, 'sine', 0.08);
}
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (e.repeat) { keys[k] = true; return; }
  keys[k] = true;
  if (state === 'record') { recordKey(k); return; }
  if (state === 'quiz') { quizKey(k); return; }
  if (state === 'menu') {
    if (k === 'ArrowLeft' || k === 'a') { sel = (sel + 4) % 5; beep(400, 0.06); }
    if (k === 'ArrowRight' || k === 'd') { sel = (sel + 1) % 5; beep(400, 0.06); }
    if (k === '1') toggleSetting('count');
    if (k === '2') toggleSetting('add');
    if (k === '3') toggleSetting('letters');
    if (k === '4') toggleSetting('level');
    if (k === '5') toggleSetting('truck');
    if (k === 'v') openRecorder();
    if (k === ' ' || k === 'Enter') startGame();
  } else {
    if (k === ' ' || k === 'ArrowUp' || k === 'w') jump();
    if (k === 'Escape') state = 'menu';
  }
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
// touch controls (iPad)
let touchMode = !!(navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
const TB = {
  left:  { x: 20,  y: 400, w: 110, h: 110, label: '◀' },
  right: { x: 145, y: 400, w: 110, h: 110, label: '▶' },
  spin:  { x: 690, y: 400, w: 120, h: 110, label: 'SPIN' },
  jump:  { x: 830, y: 400, w: 110, h: 110, label: '▲' },
};
const ptrs = new Map();
let jumpHeld = false;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function refreshTouch() {
  const down = {};
  for (const pt of ptrs.values())
    for (const [n, b] of Object.entries(TB))
      if (pt.x >= b.x - 15 && pt.x <= b.x + b.w + 15 && pt.y >= b.y - 15 && pt.y <= b.y + b.h + 15) down[n] = true;
  keys.ArrowLeft = !!down.left; keys.ArrowRight = !!down.right; keys.ArrowDown = !!down.spin;
  if (down.jump && !jumpHeld) jump();
  jumpHeld = !!down.jump;
  for (const n in TB) TB[n].down = !!down[n];
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') touchMode = true;
  if (state !== 'play') return;
  e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, toCanvas(e)); refreshTouch();
});
cv.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, toCanvas(e)); refreshTouch(); } });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, e => { ptrs.delete(e.pointerId); refreshTouch(); }));
cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('click', e => {
  const c = toCanvas(e);
  if (state === 'quiz') {
    if (!quiz || quiz.done) return;
    for (let i = 0; i < 3; i++) {
      const b = QB(i);
      if (c.x >= b.x && c.x <= b.x + b.w && c.y >= b.y && c.y <= b.y + b.h) { answerQuiz(i); return; }
    }
    if (c.y > 40 && c.y < 310) speakClips(quiz.clips, quiz.say);   // tap the question to hear it again
    return;
  }
  if (state === 'record') {
    for (const b of RB) if (c.x >= b.x && c.x <= b.x + b.w && c.y >= b.y && c.y <= b.y + b.h) { recAction(b.id); return; }
    return;
  }
  if (state !== 'menu') return;
  if (c.y < 62 && c.x > W - 232) { openRecorder(); return; }
  if (c.y >= 480 && c.y <= 535) {
    for (const b of SETBTN) if (c.x >= b.x && c.x <= b.x + BW) { toggleSetting(b.id); return; }
    return;
  }
  const i = Math.round((c.x - 130) / 175);
  if (i >= 0 && i < 5 && c.y > 240 && c.y < 480) { sel = i; startGame(); }
});

// ---------- update ----------
function update(dt) {
  t += dt;
  const left = keys.ArrowLeft || keys.a, right = keys.ArrowRight || keys.d;
  p.spinning = !!(keys.ArrowDown || keys.s);
  const speed = p.spinning ? 340 : 260;
  const target = ((right ? 1 : 0) - (left ? 1 : 0)) * speed;
  if (target) p.face = Math.sign(target);
  p.hurt = Math.max(0, (p.hurt || 0) - dt);
  if (p.hurt < 0.75) p.vx += (target - p.vx) * Math.min(1, dt * 10);   // no steering right after a bump
  p.x = Math.max(cfg.truck ? 75 : 20, p.x + p.vx * dt);
  p.wheel = (p.wheel || 0) + p.vx * dt / 32;

  p.vy += 1800 * dt;
  if (p.spinning && p.vy > 120) p.vy *= 0.9;      // spinjitzu floats a little
  const prev = p.y;
  p.y += p.vy * dt;
  let on = false;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; on = true; }
  for (const pl of platforms) {
    if (p.vy >= 0 && prev <= pl.y + 2 && p.y >= pl.y && p.x + (cfg.truck ? 55 : 12) > pl.x && p.x - (cfg.truck ? 55 : 12) < pl.x + pl.w) {
      p.y = pl.y; p.vy = 0; on = true;
    }
  }
  p.on = on;
  if (on) p.jumps = 0;

  cam = Math.max(0, cam + (p.x - 300 - cam) * Math.min(1, dt * 6));
  while (nextX < cam + W + 300) gen(nextX);
  platforms = platforms.filter(pl => pl.x + pl.w > cam - 200);

  const cx = p.x, cy = p.y - (cfg.truck ? 55 : 32);
  let quizFor = false;
  for (const it of items) {
    if (it.k === 'skel') { it.x = it.x0 + Math.sin(t * 1.2 + it.x0) * 70; skelHit(it); continue; }
    if (it.k === 'buddy') it.x = it.x0 + Math.sin(t * 1.5 + it.x0) * 60;
    let dx = cx - it.x, dy = cy - it.y, d = Math.hypot(dx, dy);
    if (p.spinning && (it.k === 'stud' || it.k === 'ball') && d < 190 && d > 1) { it.x += dx / d * 520 * dt; it.y += dy / d * 520 * dt; }
    if (d < (p.spinning ? 62 : 38) + (cfg.truck ? 30 : 0)) {
      it.gone = true;
      if (it.k === 'stud') { score.studs++; beep(880 + (score.studs % 5) * 60, 0.08, 'square', 0.04); burst(it.x, it.y, 5, ['#ffd23f', '#fff3b0']); }
      if (it.k === 'ball') { score.balls++; jingle([660, 880, 1100]); burst(it.x, it.y, 18, ['#ff3b3b', '#fff', '#ffd23f']); catchPoke(pickKind(), it.x, it.y); quizFor = true; }
      if (it.k === 'buddy') { score.buddies++; jingle([520, 660, 780, 1040]); burst(it.x, it.y, 22, ['#ff77aa', '#ffd23f', '#fff']); catchPoke(it.kind, it.x, it.y); quizFor = true; }
    }
  }
  items = items.filter(it => !it.gone && it.x > cam - 200);
  if (quizFor && quizOn() && t - lastQuiz > 6) startQuiz();

  const total = score.studs + score.balls * 3 + score.buddies * 5 + score.stars * 3;
  if (Math.floor(total / 25) > lastMile) {
    lastMile = Math.floor(total / 25);
    jingle([523, 659, 784, 1047, 1319]);
    burst(p.x, p.y - 60, 60, BRICKS.concat(['#fff']));
    say(['AWESOME!', 'NINJA POWER!', 'SO COOL!', 'SPINJITZU!'][lastMile % 4], p.x, p.y - 100);
  }

  for (const q of parts) { q.life -= dt; q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.life > 0);
  for (const s of texts) { s.life -= dt; s.y -= 30 * dt; }
  texts = texts.filter(s => s.life > 0);
}

// ---------- drawing ----------
function stud(x, y, w = 16, h = 7, color = '#e8b923') {
  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y - h, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - w / 2, y - h, w, 2);
}
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#d4f1ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ellipse(820, 90, 44, 44, '#fff3a0');
  for (let i = -1; i < 6; i++) {            // clouds
    const x = ((i * 260 - cam * 0.2) % 1560 + 1560) % 1560 - 200, y = 70 + (i * 53 % 90 + 90) % 90;
    ellipse(x, y, 50, 22, '#fff'); ellipse(x + 35, y + 6, 40, 18, '#fff'); ellipse(x - 35, y + 8, 36, 16, '#fff');
  }
  const base = Math.floor(cam * 0.4 / 160);  // brick hills
  for (let i = -1; i < 8; i++) {
    const k = base + i, h = 70 + ((k * 7919) % 5 + 5) % 5 * 28;
    const x = k * 160 - cam * 0.4;
    ctx.fillStyle = '#86c27a'; ctx.fillRect(x, GROUND - h, 150, h);
    ctx.fillStyle = '#77b36b'; ctx.fillRect(x, GROUND - h, 150, 6);
    for (let s = 0; s < 3; s++) stud(x + 30 + s * 45, GROUND - h, 22, 8, '#86c27a');
  }
  ctx.fillStyle = '#3fa34d'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#34893f'; ctx.fillRect(0, GROUND, W, 8);
  for (let x = -(cam % 60); x < W + 60; x += 60) stud(x + 30, GROUND + 38, 26, 9, '#4cb85c');
}

function drawPlatform(pl) {
  const x = pl.x - cam;
  if (x > W + 50 || x + pl.w < -50) return;
  ctx.fillStyle = pl.color; ctx.fillRect(x, pl.y, pl.w, 26);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x, pl.y + 20, pl.w, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x, pl.y, pl.w, 3);
  const n = Math.floor(pl.w / 30);
  for (let i = 0; i < n; i++) stud(x + 15 + i * (pl.w - 30) / Math.max(1, n - 1), pl.y, 18, 7, pl.color);
}

function drawMinifig(x, y, n, step) {
  const sw = Math.sin(step) * 5;
  ctx.fillStyle = n.d;                                       // legs
  ctx.fillRect(x - 14, y - 16 + Math.max(0, -sw), 13, 16 - Math.max(0, -sw));
  ctx.fillRect(x + 1, y - 16 + Math.max(0, sw), 13, 16 - Math.max(0, sw));
  ctx.fillStyle = n.c; ctx.fillRect(x - 15, y - 42, 30, 28); // torso
  ctx.fillStyle = '#e8b923'; ctx.fillRect(x - 15, y - 24, 30, 5); // gold belt
  ctx.fillStyle = n.d; ctx.fillRect(x - 15, y - 42, 30, 4);
  ctx.fillStyle = n.c;                                       // arms
  ctx.fillRect(x - 23, y - 40 + sw * 0.4, 8, 22); ctx.fillRect(x + 15, y - 40 - sw * 0.4, 8, 22);
  ellipse(x - 19, y - 17 + sw * 0.4, 5, 5, '#ffd23f'); ellipse(x + 19, y - 17 - sw * 0.4, 5, 5, '#ffd23f');
  ctx.fillStyle = n.c; ctx.fillRect(x - 13, y - 66, 26, 25);   // hood head
  ctx.fillStyle = n.d; ctx.fillRect(x - 13, y - 44, 26, 3);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 10, y - 58, 20, 10); // face slit
  ctx.fillStyle = '#111'; ctx.fillRect(x - 6, y - 55, 3, 5); ctx.fillRect(x + 3, y - 55, 3, 5);
  stud(x, y - 66, 12, 5, n.c);                                // head stud
}

// Monster truck with the ninja minifig sitting in the cab. Drawn at the origin, wheels touching y=0, facing right.
function drawTruck(n, wa, bob) {
  ctx.save(); ctx.translate(0, bob);
  ctx.fillStyle = n.d; ctx.fillRect(-72, -72, 144, 28);                 // chassis
  ctx.fillStyle = '#e8b923'; ctx.fillRect(-72, -52, 144, 6);            // gold stripe
  ctx.fillStyle = n.c;
  ctx.beginPath(); ctx.roundRect(-54, -118, 90, 52, 10); ctx.fill();    // cab
  ctx.fillRect(34, -92, 40, 24);                                         // hood
  ctx.fillStyle = '#444'; ctx.fillRect(72, -68, 8, 24);                  // bumper
  ellipse(74, -82, 6, 6, '#fff3a0');                                     // headlight
  stud(-10, -118, 24, 8, n.c);                                           // roof stud
  ctx.fillStyle = '#bfe8ff'; ctx.fillRect(-46, -110, 64, 30);            // window
  ctx.save();
  ctx.beginPath(); ctx.rect(-46, -110, 64, 30); ctx.clip();
  ctx.translate(-14, -62); ctx.scale(0.66, 0.66);
  drawMinifig(0, 0, n, 0.8);                                              // the driver
  ctx.restore();
  ctx.strokeStyle = n.d; ctx.lineWidth = 4; ctx.strokeRect(-46, -110, 64, 30);
  ctx.restore();
  for (const wx of [-48, 48]) {                                           // big wheels
    ctx.save(); ctx.translate(wx, -32);
    ellipse(0, 0, 32, 32, '#1e1e1e');
    for (let i = 0; i < 10; i++) { ctx.save(); ctx.rotate(wa + i * Math.PI / 5); ctx.fillStyle = '#0c0c0c'; ctx.fillRect(-5, -37, 10, 8); ctx.restore(); }
    ellipse(0, 0, 17, 17, '#c9c9c9');
    ctx.rotate(wa); ctx.fillStyle = n.c; ctx.fillRect(-3, -15, 6, 30); ctx.fillRect(-15, -3, 30, 6);
    ellipse(0, 0, 5, 5, '#333');
    ctx.restore();
  }
}

function drawPlayer() {
  const n = NINJAS[sel], x = p.x - cam;
  if (p.spinning) {
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = n.c; ctx.globalAlpha = 0.55; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(x, p.y - 8 - i * 14 * (cfg.truck ? 1.6 : 1), (16 + i * 9) * (cfg.truck ? 1.8 : 1), 6, t * 12 + i, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (cfg.truck) {
    const tilt = p.spinning ? -0.3 : Math.max(-0.25, Math.min(0.25, p.vy * 0.0004));
    const bob = p.on ? Math.sin(t * 22) * 2 * Math.min(1, Math.abs(p.vx) / 200) : 0;
    ctx.save();
    ctx.translate(x, p.y); ctx.scale(p.face, 1); ctx.rotate(tilt * p.face);
    drawTruck(n, p.wheel * p.face + (p.spinning ? t * 30 : 0), bob);
    ctx.restore();
    if (p.on) ellipse(x, p.y + 2, 70, 5, 'rgba(0,0,0,0.2)');
    return;
  }
  ctx.save();
  ctx.translate(x, 0);
  ctx.scale(p.spinning ? Math.max(0.25, Math.abs(Math.cos(t * 20))) : p.face, 1);

function drawItem(it) {
  const x = it.x - cam, bob = Math.sin(t * 4 + it.x) * 3;
  if (x < -40 || x > W + 40) return;
  if (it.k === 'stud') {
    ctx.fillStyle = '#c99a12'; ctx.fillRect(x - 11, it.y - 3 + bob, 22, 11);
    ellipse(x, it.y - 3 + bob, 11, 6, '#ffd23f'); ellipse(x - 3, it.y - 5 + bob, 4, 2, '#fff6bf');
  } else if (it.k === 'ball') {
    const y = it.y + bob;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 3) * 0.3);
    ctx.beginPath(); ctx.arc(0, 0, 16, Math.PI, 0); ctx.fillStyle = '#ee2b2b'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
    ellipse(0, 0, 6, 6, '#fff'); ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  } else if (it.k === 'skel') {
    drawSkeleton(x, it.y, Math.cos(t * 1.2 + it.x0) >= 0 ? 1 : -1, t * 10);
  } else {                              // wandering Pokémon
    const y = it.y + Math.abs(Math.sin(t * 6 + it.x0)) * -6, f = Math.cos(t * 1.5 + it.x0) >= 0 ? 1 : -1;
    ctx.save(); ctx.translate(x, y); ctx.scale(f, 1);

}

function catchPoke(kind, x, y) {
  const pk = POKE[kind];
  score.caught[pk.id]++;
  if (kind === POKE.length - 1) {                         // rare!
    say('RARE ' + pk.name + '!!', x, y - 40);
    jingle([392, 523, 659, 784, 1047, 1319, 1568]); burst(x, y, 70, ['#b97cff', '#ffd23f', '#fff', '#7ad7ff']);
    return;
  }
  say((score.caught[pk.id] === 1 ? 'NEW ' : 'Gotcha ') + pk.name + '!', x, y - 40);
  jingle([520, 660, 780, 1040]); burst(x, y, 22, ['#ff77aa', '#ffd23f', '#fff']);
}

// Skulkin skeletons: jump on them or use spinjitzu to smash them. A bump just bounces you back.
function skelHit(it) {
  const reach = p.spinning ? 100 : (cfg.truck ? 73 : 32);
  if (Math.abs(p.x - it.x) > reach || p.y <= GROUND - 70) return;
  if (p.spinning || (p.vy > 0 && p.y < GROUND - 25)) {
    it.gone = true; score.studs += 5; p.vy = -520; p.jumps = 1;
    burst(it.x, GROUND - 35, 26, ['#f4f4f4', '#bbb', '#222']);
    say('Smash!', it.x, GROUND - 90); jingle([300, 500, 700]);
  } else if (!p.hurt) {
    p.hurt = 1; p.vx = (p.x < it.x ? -1 : 1) * 380; p.vy = -380;
    beep(150, 0.25, 'sawtooth', 0.06); say('Oof!', p.x, p.y - 120);
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';

  ctx.beginPath(); ctx.roundRect(14, 12, sx + POKE.length * slot + 4, 52, 14); ctx.fill();
  ctx.font = FONT; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  drawItem({ k: 'stud', x: cam + 40, y: 40 }); ctx.fillText(score.studs, 58, 40);
  if (quizOn()) { ctx.fillStyle = '#ffd23f'; ctx.fillText('★ ' + score.stars, 118, 40); ctx.fillStyle = '#fff'; }
  POKE.forEach((pk, i) => {                       // collection: one slot per Pokémon, dim until caught
    const x0 = sx + i * slot, n = score.caught[pk.id];
    ctx.save(); ctx.globalAlpha = n ? 1 : 0.35; ctx.translate(x0 + 14, 47); ctx.scale(0.5, 0.5); drawCreature(pk.id); ctx.restore();
    ctx.fillText(n, x0 + 38, 40);

  if (touchMode) {
    ctx.textAlign = 'center';
    for (const b of Object.values(TB)) {
      ctx.globalAlpha = b.down ? 0.75 : 0.4;

      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 24); ctx.fill();

      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  } else if (t < 12) {
    ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.roundRect(W / 2 - 330, H - 52, 660, 40, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText('← → run     ↑ or SPACE jump (twice!)     ↓ SPINJITZU!', W / 2, H - 32);
    ctx.textAlign = 'left';
  }
}

// ---------- quiz ----------
const WORDS = ['NINJA', 'KAI', 'JAY', 'COLE', 'ZANE', 'LLOYD', 'BRICK', 'LEGO', 'DRAGON', 'SWORD', 'STUD', 'BALL', 'BUDDY', 'HERO', 'CAT', 'DOG', 'SUN', 'FISH', 'MOON', 'STAR'];
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickOptions(correct, make) {
  const set = new Set([correct]);
  for (let g = 0; set.size < 3 && g < 200; g++) set.add(make());
  const opts = shuffle([...set]);
  return { options: opts.map(String), answer: opts.indexOf(correct) };
}
function makeQuestion(cat) {
  const lv = cfg.level;
  if (cat === 'count') {
    const max = [5, 10, 15][lv], n = 1 + rnd(max);
    return { cat, title: 'Count the studs!', say: 'How many studs are there?', clips: ['q_count'], vis: { type: 'studs', n },
      prompt: 'How many studs?', ...pickOptions(n, () => Math.max(1, n + rnd(5) - 2)) };
  }
  if (cat === 'add') {
    const max = [5, 10, 20][lv], sum = 2 + rnd(max - 1);
    const lo = Math.max(1, sum - 10), hi = Math.min(10, sum - 1), a = lo + rnd(hi - lo + 1), b = sum - a;
    return { cat, title: 'Brick math!', say: `What is ${a} plus ${b}?`, clips: ['what_is', 'n' + a, 'plus', 'n' + b], vis: { type: 'add', a, b },
      prompt: '', ...pickOptions(sum, () => Math.max(1, sum + rnd(5) - 2)) };
  }
  if (Math.random() < 0.4) {                       // "Who is it?" - read the Pokémon's name
    const kd = POKE[rnd(POKE.length)];
    return { cat, title: 'Who is it?', say: 'Which Pokémon is this?', clips: ['q_poke'], vis: { type: 'poke', id: kd.id },
      prompt: 'Which Pokémon is this?', ...pickOptions(kd.name, () => POKE[rnd(POKE.length)].name) };
  }
  const word = WORDS[rnd(WORDS.length)], atEnd = lv === 2 && Math.random() < 0.5;
  const correct = atEnd ? word[word.length - 1] : word[0];
  return { cat, title: 'Letter time!', say: `Which letter does ${word.toLowerCase()} ${atEnd ? 'end' : 'start'} with?`,
    clips: ['which_letter', 'w_' + word, atEnd ? 'ends' : 'starts'],
    vis: { type: 'word', word }, prompt: `Which letter does it ${atEnd ? 'END' : 'START'} with?`,
    ...pickOptions(correct, () => String.fromCharCode(65 + rnd(26))) };
}
function startQuiz() {
  const bag = [];
  ['count', 'add', 'letters'].filter(c => cfg[c]).forEach(c => { for (let i = 0; i <= Math.min(misses[c], 4); i++) bag.push(c); });
  quiz = Object.assign(makeQuestion(bag[rnd(bag.length)]), { sel: 0, wrong: [], done: false, doneT: 0, shake: 0 });
  state = 'quiz';
  ptrs.clear(); jumpHeld = false; keys.ArrowLeft = keys.ArrowRight = keys.ArrowDown = false;
  speakClips(quiz.clips, quiz.say);
}
function quizKey(k) {
  if (!quiz || quiz.done) return;
  if (k === 'ArrowLeft' || k === 'a') quiz.sel = (quiz.sel + 2) % 3;
  else if (k === 'ArrowRight' || k === 'd') quiz.sel = (quiz.sel + 1) % 3;
  else if (k === '1' || k === '2' || k === '3') answerQuiz(+k - 1);
  else if (k === ' ' || k === 'Enter') answerQuiz(quiz.sel);
  else if (k === 'r') speakClips(quiz.clips, quiz.say);
}
function answerQuiz(i) {
  if (quiz.wrong.includes(i)) return;
  if (i === quiz.answer) {
    quiz.done = true; quiz.doneT = 1.2; quiz.sel = i;
    score.stars++; score.studs += 3;
    jingle([660, 880, 1100, 1320]); const g = rnd(4); speakClips(['good' + g], GOOD[g]);
  } else {
    quiz.wrong.push(i); quiz.shake = 0.4; misses[quiz.cat]++;
    beep(200, 0.25, 'sawtooth', 0.05); speakClips(['again'], 'Try again!');
  }
}
function quizTick(dt) {
  if (!quiz) { state = 'play'; return; }
  if (quiz.shake > 0) quiz.shake -= dt;
  if (quiz.done && (quiz.doneT -= dt) <= 0) {
    state = 'play'; lastQuiz = t; quiz = null;
    burst(p.x, p.y - 60, 50, BRICKS.concat(['#fff']));
    say('+3 studs!', p.x, p.y - 100);
  }
}
// ---------- your voice ----------
// Recordings are saved in this browser (IndexedDB) and played in place of the computer voice.
// Sentences are stitched together from short clips; if any clip is missing, the computer voice is used instead.
const GOOD = ['Great job!', 'You got it!', 'Awesome!', 'Super ninja!'];
const NUMW = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const CLIPS = [
  { id: 'q_count', text: 'How many studs are there?' }, { id: 'q_poke', text: 'Which Pokémon is this?' },
  { id: 'what_is', text: 'What is' }, { id: 'plus', text: 'plus' },
  ...NUMW.slice(1).map((w, i) => ({ id: 'n' + (i + 1), text: w, show: String(i + 1) })),
  { id: 'which_letter', text: 'Which letter does' }, { id: 'starts', text: 'start with?' }, { id: 'ends', text: 'end with?' },
  ...WORDS.map(w => ({ id: 'w_' + w, text: w.toLowerCase(), show: w })),
  ...GOOD.map((g, i) => ({ id: 'good' + i, text: g })),
  { id: 'again', text: 'Try again!' },
];
const voice = new Map();                          // clip id -> AudioBuffer
let voiceSrcs = [];
function getAC() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function stopVoice() { voiceSrcs.forEach(s => { try { s.stop(); } catch (e) {} }); voiceSrcs = []; }
function speakClips(ids, text) {
  stopVoice();
  try {
    if (cfg.voice && ids.every(id => voice.has(id))) {
      try { speechSynthesis.cancel(); } catch (e) {}
      const a = getAC(); let when = a.currentTime + 0.05;
      for (const id of ids) {
        const b = voice.get(id), s = a.createBufferSource();
        s.buffer = b; s.connect(a.destination); s.start(when); voiceSrcs.push(s);
        when += b.duration + 0.04;
      }
      return;
    }
  } catch (e) {}
  speak(text);
}
function trimBuffer(a, buf) {                       // cut silence from both ends so sentences flow
  const d = buf.getChannelData(0), th = 0.02;
  let s = 0, e = d.length - 1;
  while (s < e && Math.abs(d[s]) < th) s++;
  while (e > s && Math.abs(d[e]) < th) e--;
  if (e - s < 200) return buf;
  s = Math.max(0, s - Math.floor(buf.sampleRate * 0.03)); e = Math.min(d.length - 1, e + Math.floor(buf.sampleRate * 0.06));
  const out = a.createBuffer(1, e - s + 1, buf.sampleRate); out.copyToChannel(d.slice(s, e + 1), 0);
  return out;
}
const decodeBlob = async blob => {
  const a = getAC(), buf = await blob.arrayBuffer();
  return trimBuffer(a, await new Promise((res, rej) => a.decodeAudioData(buf.slice(0), res, rej)));
};
let idbDb = null;
function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('nbr_voice', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('clips');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function idbPut(id, blob) {
  idbDb = idbDb || await idbOpen(); if (!idbDb) return;
  return new Promise(res => { const tx = idbDb.transaction('clips', 'readwrite'); tx.objectStore('clips').put(blob, id); tx.oncomplete = tx.onerror = () => res(); });
}
async function idbAll() {
  idbDb = idbDb || await idbOpen(); if (!idbDb) return [];
  return new Promise(res => {
    const out = [], rq = idbDb.transaction('clips').objectStore('clips').openCursor();
    rq.onsuccess = e => { const c = e.target.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
    rq.onerror = () => res(out);
  });
}
async function loadVoices() {
  try { for (const [id, blob] of await idbAll()) { try { voice.set(id, await decodeBlob(blob)); } catch (e) {} } } catch (e) {}
}

// recorder screen
let rec = { i: 0, mode: 'idle', msg: '', stream: null, mr: null, timer: 0, flash: 0, t: 0 };
const RB = [
  { id: 'back', x: 140, y: 335, w: 150, h: 85, label: '◀ Back' },
  { id: 'rec', x: 310, y: 335, w: 240, h: 85 },
  { id: 'play', x: 570, y: 335, w: 120, h: 85, label: '▶ Hear' },
  { id: 'next', x: 710, y: 335, w: 110, h: 85, label: 'Next ▶' },
  { id: 'voice', x: 140, y: 436, w: 330, h: 40 },
  { id: 'done', x: 530, y: 436, w: 290, h: 40, label: 'Finish ✓' },
];
function openRecorder() {
  rec.i = Math.max(0, CLIPS.findIndex(c => !voice.has(c.id))); rec.mode = 'idle'; rec.msg = ''; rec.flash = 0;
  state = 'record';
}
function leaveRecorder() {
  recStop(); if (rec.stream) { rec.stream.getTracks().forEach(tr => tr.stop()); rec.stream = null; }
  state = 'menu';
}
async function recStart() {
  if (rec.mode === 'rec' || rec.flash > 0) return;
  try {
    if (!rec.stream) rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [], mr = new MediaRecorder(rec.stream), idx = rec.i;
    rec.mr = mr;
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearTimeout(rec.timer);
      try {
        const blob = new Blob(chunks, { type: mr.mimeType || 'audio/mp4' });
        voice.set(CLIPS[idx].id, await decodeBlob(blob));
        idbPut(CLIPS[idx].id, blob);
        rec.mode = 'saved'; rec.flash = 0.8;
        speakClips([CLIPS[idx].id], CLIPS[idx].text);
      } catch (e) { rec.mode = 'err'; rec.msg = "That didn't record. Try again."; }
    };
    mr.start(); rec.mode = 'rec'; rec.t = 0; rec.timer = setTimeout(recStop, 5000);
  } catch (e) { rec.mode = 'err'; rec.msg = 'Microphone is blocked. Allow it in settings.'; }
}
function recStop() { if (rec.mode === 'rec' && rec.mr && rec.mr.state === 'recording') rec.mr.stop(); }
function recGo(d) { if (rec.mode === 'rec') return; rec.i = Math.max(0, Math.min(CLIPS.length - 1, rec.i + d)); rec.mode = 'idle'; rec.msg = ''; rec.flash = 0; }
function recAction(id) {
  if (id === 'rec') { rec.mode === 'rec' ? recStop() : recStart(); }
  else if (id === 'back') recGo(-1);
  else if (id === 'next') recGo(1);
  else if (id === 'play') speakClips([CLIPS[rec.i].id], CLIPS[rec.i].text);
  else if (id === 'voice') { cfg.voice = !cfg.voice; saveCfg(); }
  else if (id === 'done') leaveRecorder();
}
function recordKey(k) {
  if (k === 'Escape') leaveRecorder();
  else if (k === ' ' || k === 'Enter' || k === 'r') recAction('rec');
  else if (k === 'ArrowRight') recAction('next');
  else if (k === 'ArrowLeft') recAction('back');
  else if (k === 'p') recAction('play');
}
function recTick(dt) {
  rec.t += dt;
  if (rec.flash > 0 && (rec.flash -= dt) <= 0) {      // saved: move on to the next line
    if (rec.i < CLIPS.length - 1) { rec.i++; rec.mode = 'idle'; } else { rec.mode = 'idle'; rec.msg = 'All done! Tap Finish.'; }
  }
}
function drawRecorder() {
  const c = CLIPS[rec.i], have = voice.has(c.id);
  drawBackground();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fffdf2'; ctx.beginPath(); ctx.roundRect(100, 24, 760, 492, 28); ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = '#e63946'; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#222';
  ctx.font = 'bold 38px "Arial Rounded MT Bold", Arial'; ctx.fillText('🎤 Record your voice', W / 2, 64);
  ctx.fillStyle = '#666'; ctx.font = 'bold 22px Arial';
  ctx.fillText(`Line ${rec.i + 1} of ${CLIPS.length}     ✓ ${voice.size} recorded`, W / 2, 104);
  ctx.fillStyle = '#222'; let fs = 64; const big = c.show || c.text;
  ctx.font = `bold ${fs}px Arial`;
  while (ctx.measureText(big).width > 680 && fs > 24) { fs -= 4; ctx.font = `bold ${fs}px Arial`; }
  ctx.fillText(big, W / 2, 190);
  if (c.show && c.show !== c.text.toUpperCase()) { ctx.fillStyle = '#888'; ctx.font = 'bold 26px Arial'; ctx.fillText(`say "${c.text}"`, W / 2, 245); }
  ctx.font = 'bold 26px Arial';
  if (rec.mode === 'rec') { ctx.fillStyle = '#e63946'; ctx.globalAlpha = 0.6 + Math.sin(rec.t * 8) * 0.4; ctx.fillText('● Recording… tap Stop when done', W / 2, 300); ctx.globalAlpha = 1; }
  else if (rec.mode === 'saved') { ctx.fillStyle = '#2fbf4f'; ctx.fillText('✓ Saved!', W / 2, 300); }
  else if (rec.mode === 'err' || rec.msg) { ctx.fillStyle = rec.mode === 'err' ? '#e63946' : '#2fbf4f'; ctx.fillText(rec.msg, W / 2, 300); }
  else { ctx.fillStyle = have ? '#2a9d8f' : '#666'; ctx.fillText(have ? '✓ Recorded. Tap Hear, or record again.' : 'Tap Record, say it, then tap Stop.', W / 2, 300); }
  for (const b of RB) {
    const label = b.id === 'rec' ? (rec.mode === 'rec' ? '■ Stop' : '● Record') : b.id === 'voice' ? 'Use my voice: ' + (cfg.voice ? 'ON' : 'OFF') : b.label;
    ctx.fillStyle = b.id === 'rec' ? (rec.mode === 'rec' ? '#555' : '#e63946') : b.id === 'done' ? '#2fbf4f' : b.id === 'voice' ? (cfg.voice ? '#2a9d8f' : '#999') : '#4361ee';
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 20); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${b.h > 50 ? 30 : 22}px Arial`; ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 2);
  }
  if (!touchMode) { ctx.fillStyle = '#888'; ctx.font = '18px Arial'; ctx.fillText('Space = record / stop     ← → = back / next     P = hear', W / 2, 496); }
  ctx.textAlign = 'left';
}

function bigStud(x, y, s, c = '#ffd23f', d = '#c99a12') {
  ellipse(x, y + s * 0.3, s / 2, s * 0.25, d);
  ctx.fillStyle = d; ctx.fillRect(x - s / 2, y, s, s * 0.3);
  ellipse(x, y, s / 2, s * 0.25, c);
  ellipse(x - s * 0.12, y - s * 0.06, s * 0.14, s * 0.07, 'rgba(255,255,255,0.6)');
}
const QB = i => ({ x: 140 + i * 240, y: 335, w: 200, h: 120 });
const QCOL = ['#e63946', '#4361ee', '#2a9d8f'];
function drawQuiz() {
  const q = quiz, v = q.vis;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fffdf2'; ctx.beginPath(); ctx.roundRect(100, 30, 760, 480, 28); ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = NINJAS[sel].c; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#222'; ctx.font = 'bold 40px "Arial Rounded MT Bold", Arial';
  ctx.fillText(q.title + ' 🔊', W / 2, 78);
  if (v.type === 'studs') {
    const rows = Math.ceil(v.n / 5);
    for (let i = 0; i < v.n; i++) {
      const r = Math.floor(i / 5), c = i % 5, inRow = Math.min(5, v.n - r * 5);
      bigStud(W / 2 + (c - (inRow - 1) / 2) * 62, 150 + r * 46 + (rows === 1 ? 30 : 0), 40);
    }
  } else if (v.type === 'add') {
    ctx.fillStyle = '#222'; ctx.font = 'bold 84px "Arial Rounded MT Bold", Arial';
    ctx.fillText(`${v.a} + ${v.b} = ?`, W / 2, 150);
    for (let i = 0; i < v.a; i++) bigStud(W / 2 - 190 + (i % 5 - 2) * 34, 215 + Math.floor(i / 5) * 32, 26);
    for (let i = 0; i < v.b; i++) bigStud(W / 2 + 190 + (i % 5 - 2) * 34, 215 + Math.floor(i / 5) * 32, 26, '#ee4b4b', '#a82a2a');
  } else if (v.type === 'poke') {
    ctx.save(); ctx.translate(W / 2, 190); ctx.scale(1.9, 1.9); drawCreature(v.id); ctx.restore();
  } else {
    const n = v.word.length;
    for (let i = 0; i < n; i++) {
      const x = W / 2 + (i - (n - 1) / 2) * 84, col = BRICKS[i % BRICKS.length];
      ctx.fillStyle = col; ctx.fillRect(x - 38, 135, 76, 86);
      stud(x, 135, 28, 8, col);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 64px Arial'; ctx.fillText(v.word[i], x, 180);
    }
  }
  ctx.fillStyle = q.done ? '#2fbf4f' : '#444'; ctx.font = 'bold 34px Arial';
  ctx.fillText(q.done ? 'Great job! ⭐' : q.prompt, W / 2, 285);
  q.options.forEach((o, i) => {
    const b = QB(i), wrong = q.wrong.includes(i), good = q.done && i === q.answer;
    const dx = wrong && q.shake > 0 ? Math.sin(q.shake * 60) * 8 : 0;
    ctx.fillStyle = good ? '#2fbf4f' : wrong ? '#b5b5b5' : QCOL[i];
    ctx.beginPath(); ctx.roundRect(b.x + dx, b.y, b.w, b.h, 22); ctx.fill();
    if (i === q.sel && !q.done && !wrong) { ctx.lineWidth = 8; ctx.strokeStyle = '#222'; ctx.stroke(); }
    ctx.fillStyle = '#fff';
    let fs = 76; ctx.font = 'bold 76px Arial';
    while (ctx.measureText(o).width > b.w - 16 && fs > 20) { fs -= 4; ctx.font = `bold ${fs}px Arial`; }   // long names shrink to fit
    ctx.fillText(o, b.x + b.w / 2 + dx, b.y + b.h / 2 + 4);
    if (!touchMode) { ctx.font = 'bold 22px Arial'; ctx.fillText(i + 1, b.x + 22, b.y + 24); }
  });
  ctx.fillStyle = '#777'; ctx.font = 'bold 20px Arial';
  ctx.fillText(touchMode ? 'Tap an answer. Tap the question to hear it again.' : '← → then SPACE, or press 1 2 3.  R hears it again.', W / 2, 482);
  ctx.textAlign = 'left';
}

// ---------- loop ----------
reset();
loadVoices();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { t += dt; drawMenu(); }
  else if (state === 'record') { t += dt; cam = t * 60; recTick(dt); drawRecorder(); }
  else if (state === 'quiz') { t += dt; quizTick(dt); drawPlay(); if (quiz) drawQuiz(); }
  else { update(dt); drawPlay(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
