<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ninja Brick Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b2f; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; background: #87ceeb; border-radius: 12px; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const W = 960, H = 540, GROUND = 460;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'bold 28px "Arial Rounded MT Bold", Arial, sans-serif';

const NINJAS = [
  { name: 'Kai',   c: '#d62828', d: '#8f1d1d' },
  { name: 'Jay',   c: '#1d6fd6', d: '#154a8f' },
  { name: 'Cole',  c: '#3a3a3a', d: '#151515' },
  { name: 'Zane',  c: '#f4f4f4', d: '#b8b8b8' },
  { name: 'Lloyd', c: '#2e9e3e', d: '#1f6b2a' },
];
const BRICKS = ['#e63946', '#2a9d8f', '#f4a261', '#4361ee', '#9b5de5', '#f7c531'];

let state = 'menu', sel = 0;
let keys = {}, t = 0, cam = 0, nextX = 0, lastMile = 0;
let p, platforms, items, parts, texts, score;

// ---------- sound ----------
let ac;
function beep(f, d = 0.12, type = 'square', v = 0.05) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.stop(ac.currentTime + d);
  } catch (e) {}
}
function jingle(notes) { notes.forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.07), i * 90)); }

// ---------- setup ----------
function reset() {
  p = { x: 120, y: GROUND, vx: 0, vy: 0, face: 1, jumps: 0, on: true, spinning: false };
  platforms = []; items = []; parts = []; texts = [];
  score = { studs: 0, balls: 0, buddies: 0 };
  cam = 0; t = 0; nextX = 500; lastMile = 0;
}

function addStud(x, y) { items.push({ k: 'stud', x, y }); }
function gen(x) {
  const r = Math.floor(Math.random() * 5);
  if (r === 0) {            // arc of studs
    for (let i = 0; i < 7; i++) addStud(x + i * 40, GROUND - 30 - Math.sin(i / 6 * Math.PI) * 110);
    nextX += 380;
  } else if (r === 1) {     // floating brick with studs (+ maybe a ball)
    const w = 140 + Math.random() * 80, y = GROUND - (100 + Math.random() * 70);
    platforms.push({ x, y, w, color: BRICKS[Math.random() * BRICKS.length | 0] });
    for (let i = 0; i < 4; i++) addStud(x + 24 + i * (w - 48) / 3, y - 24);
    if (Math.random() < 0.6) items.push({ k: 'ball', x: x + w / 2, y: y - 90 });
    nextX += w + 220;
  } else if (r === 2) {     // staircase
    for (let i = 0; i < 3; i++) {
      const y = GROUND - 70 * (i + 1);
      platforms.push({ x: x + i * 170, y, w: 120, color: BRICKS[(i + 2) % BRICKS.length] });
      addStud(x + i * 170 + 60, y - 24);
    }
    items.push({ k: 'ball', x: x + 2 * 170 + 60, y: GROUND - 210 - 50 });
    nextX += 640;
  } else if (r === 3) {     // friendly yellow buddy
    items.push({ k: 'buddy', x0: x + 100, x: x + 100, y: GROUND - 20 });
    for (let i = 0; i < 5; i++) addStud(x + 40 + i * 50, GROUND - 90);
    nextX += 420;
  } else {                  // high ball (needs double jump) + ground studs
    items.push({ k: 'ball', x: x + 120, y: GROUND - 210 });
    for (let i = 0; i < 5; i++) addStud(x + i * 45, GROUND - 24);
    nextX += 400;
  }
}

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 280;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life: 0.9 + Math.random() * 0.5,
      color: colors[Math.random() * colors.length | 0], size: 5 + Math.random() * 6 });
  }
}
function say(txt, x, y) { texts.push({ txt, x, y, life: 1.3 }); }

// ---------- input ----------
function startGame() { reset(); state = 'play'; beep(520, 0.15, 'triangle'); beep(780, 0.2, 'triangle'); }
function jump() {
  if (state !== 'play' || p.jumps >= 2) return;
  p.vy = -640; p.jumps++; p.on = false;
  beep(p.jumps === 1 ? 420 : 560, 0.12, 'sine', 0.08);
}
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (e.repeat) { keys[k] = true; return; }
  keys[k] = true;
  if (state === 'menu') {
    if (k === 'ArrowLeft' || k === 'a') { sel = (sel + 4) % 5; beep(400, 0.06); }
    if (k === 'ArrowRight' || k === 'd') { sel = (sel + 1) % 5; beep(400, 0.06); }
    if (k === ' ' || k === 'Enter') startGame();
  } else {
    if (k === ' ' || k === 'ArrowUp' || k === 'w') jump();
    if (k === 'Escape') state = 'menu';
  }
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
// touch controls (iPad)
let touchMode = !!(navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
const TB = {
  left:  { x: 20,  y: 400, w: 110, h: 110, label: '◀' },
  right: { x: 145, y: 400, w: 110, h: 110, label: '▶' },
  spin:  { x: 690, y: 400, w: 120, h: 110, label: 'SPIN' },
  jump:  { x: 830, y: 400, w: 110, h: 110, label: '▲' },
};
const ptrs = new Map();
let jumpHeld = false;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function refreshTouch() {
  const down = {};
  for (const pt of ptrs.values())
    for (const [n, b] of Object.entries(TB))
      if (pt.x >= b.x - 15 && pt.x <= b.x + b.w + 15 && pt.y >= b.y - 15 && pt.y <= b.y + b.h + 15) down[n] = true;
  keys.ArrowLeft = !!down.left; keys.ArrowRight = !!down.right; keys.ArrowDown = !!down.spin;
  if (down.jump && !jumpHeld) jump();
  jumpHeld = !!down.jump;
  for (const n in TB) TB[n].down = !!down[n];
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') touchMode = true;
  if (state !== 'play') return;
  e.preventDefault(); cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, toCanvas(e)); refreshTouch();
});
cv.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, toCanvas(e)); refreshTouch(); } });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, e => { ptrs.delete(e.pointerId); refreshTouch(); }));
cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('click', e => {
  if (state !== 'menu') return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width * W;
  const i = Math.round((mx - 130) / 175);
  if (i >= 0 && i < 5) { sel = i; startGame(); }
});

// ---------- update ----------
function update(dt) {
  t += dt;
  const left = keys.ArrowLeft || keys.a, right = keys.ArrowRight || keys.d;
  p.spinning = !!(keys.ArrowDown || keys.s);
  const speed = p.spinning ? 340 : 260;
  const target = ((right ? 1 : 0) - (left ? 1 : 0)) * speed;
  if (target) p.face = Math.sign(target);
  p.vx += (target - p.vx) * Math.min(1, dt * 10);
  p.x = Math.max(20, p.x + p.vx * dt);

  p.vy += 1800 * dt;
  if (p.spinning && p.vy > 120) p.vy *= 0.9;      // spinjitzu floats a little
  const prev = p.y;
  p.y += p.vy * dt;
  let on = false;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; on = true; }
  for (const pl of platforms) {
    if (p.vy >= 0 && prev <= pl.y + 2 && p.y >= pl.y && p.x + 12 > pl.x && p.x - 12 < pl.x + pl.w) {
      p.y = pl.y; p.vy = 0; on = true;
    }
  }
  p.on = on;
  if (on) p.jumps = 0;

  cam = Math.max(0, cam + (p.x - 300 - cam) * Math.min(1, dt * 6));
  while (nextX < cam + W + 300) gen(nextX);
  platforms = platforms.filter(pl => pl.x + pl.w > cam - 200);

  const cx = p.x, cy = p.y - 32;
  for (const it of items) {
    if (it.k === 'buddy') it.x = it.x0 + Math.sin(t * 1.5 + it.x0) * 60;
    let dx = cx - it.x, dy = cy - it.y, d = Math.hypot(dx, dy);
    if (p.spinning && it.k !== 'buddy' && d < 190 && d > 1) { it.x += dx / d * 520 * dt; it.y += dy / d * 520 * dt; }
    if (d < (p.spinning ? 62 : 38)) {
      it.gone = true;
      if (it.k === 'stud') { score.studs++; beep(880 + (score.studs % 5) * 60, 0.08, 'square', 0.04); burst(it.x, it.y, 5, ['#ffd23f', '#fff3b0']); }
      if (it.k === 'ball') { score.balls++; jingle([660, 880, 1100]); burst(it.x, it.y, 18, ['#ff3b3b', '#fff', '#ffd23f']); say('Gotcha!', it.x, it.y - 20); }
      if (it.k === 'buddy') { score.buddies++; jingle([520, 660, 780, 1040]); burst(it.x, it.y, 22, ['#ff77aa', '#ffd23f', '#fff']); say('New buddy!', it.x, it.y - 40); }
    }
  }
  items = items.filter(it => !it.gone && it.x > cam - 200);

  const total = score.studs + score.balls * 3 + score.buddies * 5;
  if (Math.floor(total / 25) > lastMile) {
    lastMile = Math.floor(total / 25);
    jingle([523, 659, 784, 1047, 1319]);
    burst(p.x, p.y - 60, 60, BRICKS.concat(['#fff']));
    say(['AWESOME!', 'NINJA POWER!', 'SO COOL!', 'SPINJITZU!'][lastMile % 4], p.x, p.y - 100);
  }

  for (const q of parts) { q.life -= dt; q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.life > 0);
  for (const s of texts) { s.life -= dt; s.y -= 30 * dt; }
  texts = texts.filter(s => s.life > 0);
}

// ---------- drawing ----------
function stud(x, y, w = 16, h = 7, color = '#e8b923') {
  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y - h, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - w / 2, y - h, w, 2);
}
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#d4f1ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ellipse(820, 90, 44, 44, '#fff3a0');
  for (let i = -1; i < 6; i++) {            // clouds
    const x = ((i * 260 - cam * 0.2) % 1560 + 1560) % 1560 - 200, y = 70 + (i * 53 % 90 + 90) % 90;
    ellipse(x, y, 50, 22, '#fff'); ellipse(x + 35, y + 6, 40, 18, '#fff'); ellipse(x - 35, y + 8, 36, 16, '#fff');
  }
  const base = Math.floor(cam * 0.4 / 160);  // brick hills
  for (let i = -1; i < 8; i++) {
    const k = base + i, h = 70 + ((k * 7919) % 5 + 5) % 5 * 28;
    const x = k * 160 - cam * 0.4;
    ctx.fillStyle = '#86c27a'; ctx.fillRect(x, GROUND - h, 150, h);
    ctx.fillStyle = '#77b36b'; ctx.fillRect(x, GROUND - h, 150, 6);
    for (let s = 0; s < 3; s++) stud(x + 30 + s * 45, GROUND - h, 22, 8, '#86c27a');
  }
  ctx.fillStyle = '#3fa34d'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#34893f'; ctx.fillRect(0, GROUND, W, 8);
  for (let x = -(cam % 60); x < W + 60; x += 60) stud(x + 30, GROUND + 38, 26, 9, '#4cb85c');
}

function drawPlatform(pl) {
  const x = pl.x - cam;
  if (x > W + 50 || x + pl.w < -50) return;
  ctx.fillStyle = pl.color; ctx.fillRect(x, pl.y, pl.w, 26);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x, pl.y + 20, pl.w, 6);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x, pl.y, pl.w, 3);
  const n = Math.floor(pl.w / 30);
  for (let i = 0; i < n; i++) stud(x + 15 + i * (pl.w - 30) / Math.max(1, n - 1), pl.y, 18, 7, pl.color);
}

function drawMinifig(x, y, n, step) {
  const sw = Math.sin(step) * 5;
  ctx.fillStyle = n.d;                                       // legs
  ctx.fillRect(x - 14, y - 16 + Math.max(0, -sw), 13, 16 - Math.max(0, -sw));
  ctx.fillRect(x + 1, y - 16 + Math.max(0, sw), 13, 16 - Math.max(0, sw));
  ctx.fillStyle = n.c; ctx.fillRect(x - 15, y - 42, 30, 28); // torso
  ctx.fillStyle = '#e8b923'; ctx.fillRect(x - 15, y - 24, 30, 5); // gold belt
  ctx.fillStyle = n.d; ctx.fillRect(x - 15, y - 42, 30, 4);
  ctx.fillStyle = n.c;                                       // arms
  ctx.fillRect(x - 23, y - 40 + sw * 0.4, 8, 22); ctx.fillRect(x + 15, y - 40 - sw * 0.4, 8, 22);
  ellipse(x - 19, y - 17 + sw * 0.4, 5, 5, '#ffd23f'); ellipse(x + 19, y - 17 - sw * 0.4, 5, 5, '#ffd23f');
  ctx.fillStyle = n.c; ctx.fillRect(x - 13, y - 66, 26, 25);   // hood head
  ctx.fillStyle = n.d; ctx.fillRect(x - 13, y - 44, 26, 3);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 10, y - 58, 20, 10); // face slit
  ctx.fillStyle = '#111'; ctx.fillRect(x - 6, y - 55, 3, 5); ctx.fillRect(x + 3, y - 55, 3, 5);
  stud(x, y - 66, 12, 5, n.c);                                // head stud
}

function drawPlayer() {
  const n = NINJAS[sel], x = p.x - cam;
  if (p.spinning) {
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = n.c; ctx.globalAlpha = 0.55; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(x, p.y - 8 - i * 14, 16 + i * 9, 6, t * 12 + i, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(x, 0);
  ctx.scale(p.spinning ? Math.max(0.25, Math.abs(Math.cos(t * 20))) : p.face, 1);
  drawMinifig(0, p.y, n, p.on ? t * 16 * Math.min(1, Math.abs(p.vx) / 200) : 0.8);
  ctx.restore();
  if (p.on) ellipse(x, p.y + 2, 20, 4, 'rgba(0,0,0,0.18)');
}

function drawItem(it) {
  const x = it.x - cam, bob = Math.sin(t * 4 + it.x) * 3;
  if (x < -40 || x > W + 40) return;
  if (it.k === 'stud') {
    ctx.fillStyle = '#c99a12'; ctx.fillRect(x - 11, it.y - 3 + bob, 22, 11);
    ellipse(x, it.y - 3 + bob, 11, 6, '#ffd23f'); ellipse(x - 3, it.y - 5 + bob, 4, 2, '#fff6bf');
  } else if (it.k === 'ball') {
    const y = it.y + bob;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 3) * 0.3);
    ctx.beginPath(); ctx.arc(0, 0, 16, Math.PI, 0); ctx.fillStyle = '#ee2b2b'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke();
    ellipse(0, 0, 6, 6, '#fff'); ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  } else {                              // friendly yellow buddy
    const y = it.y + Math.abs(Math.sin(t * 6 + it.x0)) * -6, f = Math.cos(t * 1.5 + it.x0) >= 0 ? 1 : -1;
    ctx.save(); ctx.translate(x, y); ctx.scale(f, 1);
    ctx.strokeStyle = '#c99a12'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(-26, -4); ctx.lineTo(-20, -8); ctx.lineTo(-32, -20); ctx.stroke();
    ellipse(0, 4, 18, 16, '#ffd23f');
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(-18, -34); ctx.lineTo(-4, -12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -8); ctx.lineTo(18, -34); ctx.lineTo(4, -12); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.moveTo(-15, -26); ctx.lineTo(-18, -34); ctx.lineTo(-11, -29); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15, -26); ctx.lineTo(18, -34); ctx.lineTo(11, -29); ctx.fill();
    ellipse(-6, 0, 2.5, 3.5, '#222'); ellipse(8, 0, 2.5, 3.5, '#222');
    ellipse(-12, 8, 4, 4, '#ff5a5a'); ellipse(14, 8, 4, 4, '#ff5a5a');
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(1, 7, 3, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.roundRect(14, 12, 330, 52, 14); ctx.fill();
  ctx.font = FONT; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  drawItem({ k: 'stud', x: cam + 40, y: 40 }); ctx.fillText(score.studs, 58, 40);
  drawItem({ k: 'ball', x: cam + 150, y: 38 }); ctx.fillText(score.balls, 174, 40);
  const b = { k: 'buddy', x0: cam + 255, x: cam + 255, y: 50 };
  ctx.save(); ctx.translate(255, 0); ctx.scale(0.55, 0.55); drawItem({ k: 'buddy', x0: 0, x: 0, y: 92 }); ctx.restore();
  ctx.fillText(score.buddies, 285, 40);
  if (touchMode) {
    ctx.textAlign = 'center';
    for (const b of Object.values(TB)) {
      ctx.globalAlpha = b.down ? 0.75 : 0.4;
      ctx.fillStyle = b.down ? '#ffd23f' : '#000';
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 24); ctx.fill();
      ctx.globalAlpha = 0.9; ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (b.label.length > 1 ? 30 : 48) + 'px Arial';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  } else if (t < 12) {
    ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.roundRect(W / 2 - 330, H - 52, 660, 40, 14); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText('← → run     ↑ or SPACE jump (twice!)     ↓ SPINJITZU!', W / 2, H - 32);
    ctx.textAlign = 'left';
  }
}

function drawPlay() {
  drawBackground();
  platforms.forEach(drawPlatform);
  items.forEach(drawItem);
  drawPlayer();
  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life * 2); ctx.fillStyle = q.color; ctx.fillRect(q.x - cam, q.y, q.size, q.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 40px "Arial Rounded MT Bold", Arial';
  for (const s of texts) {
    ctx.globalAlpha = Math.min(1, s.life * 2); ctx.lineWidth = 6; ctx.strokeStyle = '#222'; ctx.strokeText(s.txt, s.x - cam, s.y);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(s.txt, s.x - cam, s.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  drawHUD();
}

function drawMenu() {
  cam = t * 60;
  drawBackground();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 76px "Arial Rounded MT Bold", Arial'; ctx.lineWidth = 10; ctx.strokeStyle = '#222';
  ctx.strokeText('NINJA BRICK RUN', W / 2, 90); ctx.fillStyle = '#ffd23f'; ctx.fillText('NINJA BRICK RUN', W / 2, 90);
  ctx.font = 'bold 30px Arial'; ctx.fillStyle = '#222';
  ctx.fillText(touchMode ? 'Tap your ninja to start!' : 'Pick your ninja!  Use ← → then press SPACE', W / 2, 160);
  NINJAS.forEach((n, i) => {
    const x = 130 + i * 175, on = i === sel, y = 380 - (on ? Math.abs(Math.sin(t * 6)) * 18 : 0);
    if (on) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.roundRect(x - 70, 250, 140, 190, 18); ctx.fill(); }
    ctx.save(); ctx.translate(x, y); ctx.scale(1.3, 1.3); drawMinifig(0, 0, n, 0.8); ctx.restore();
    ctx.font = 'bold 26px Arial'; ctx.fillStyle = '#222'; ctx.fillText(n.name, x, 462);
  });
  ctx.textAlign = 'left';
}

// ---------- loop ----------
reset();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') { t += dt; drawMenu(); }
  else { update(dt); drawPlay(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
